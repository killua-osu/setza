{% extends "base.html" %}

{% block body %}
    <div class="flex min-h-screen items-center justify-center px-4">
        <form method="post" class="w-full max-w-[680px] rounded-[30px] border border-line bg-surface p-8">
            {% csrf_token %}
            <div class="mb-8">
                <div class="setza-logo text-[34px]">Setza</div>
                <h1 class="mt-4 text-[34px] font-semibold">Choose your role</h1>
                <p class="text-[14px] text-[#706b65]">You can switch between Creator and Brand views later.</p>
            </div>
            {% if non_field_errors %}
                <div class="mb-4 space-y-2">
                    {% for error in non_field_errors %}
                        <div class="rounded-[18px] border border-[#ead7d1] bg-[#fcf3f0] px-4 py-3 text-[13px] text-[#8d3a2d]">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endif %}
            <div class="grid gap-4 md:grid-cols-2">
                <button type="submit" name="role" value="creator" class="setza-panel-card text-left">
                    <h2 class="text-[24px] font-semibold">Creator</h2>
                    <p class="mt-2 text-[14px] leading-6 text-[#6a6560]">Showcase services, analytics, and collaborations while keeping social connections optional.</p>
                </button>
                <button type="submit" name="role" value="brand" class="setza-panel-card text-left">
                    <h2 class="text-[24px] font-semibold">Brand</h2>
                    <p class="mt-2 text-[14px] leading-6 text-[#6a6560]">Create opportunities, discover creators, and manage campaign applications with transparent metrics.</p>
                </button>
            </div>
        </form>
    </div>
{% endblock %}
