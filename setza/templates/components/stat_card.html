<article class="setza-stat-card">
    <div>
        <p class="text-[14px] text-[#59544f]">{{ stat.label }}</p>
        <p class="mt-2 text-[30px] font-semibold leading-none text-ink">{{ stat.value }}</p>
    </div>
    <div class="setza-icon-bubble">
        <i data-lucide="{{ stat.icon }}" class="h-5 w-5 text-[#7c7670]"></i>
    </div>
</article>
