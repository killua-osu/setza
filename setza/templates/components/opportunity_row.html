<article class="setza-row-card">
    <div>
        <div class="mb-2 flex flex-wrap items-center gap-2">
            <h3 class="text-[18px] font-semibold">{{ row.title }}</h3>
            {% include "components/platform_pills.html" with items=row.platforms %}
        </div>
        <div class="flex flex-wrap gap-6 text-[14px] text-[#5f5a54]">
            <span>2 Applications</span>
            <span>{{ row.budget }}</span>
            <span>{{ row.engagement_requirement }}</span>
            <span>{{ row.date }}</span>
        </div>
    </div>
    <div class="flex items-center gap-2">
        <a href="{% url 'brand:opportunity_detail' row.slug %}" class="setza-outline-btn">View Applications</a>
        <button class="setza-outline-btn">Edit</button>
    </div>
</article>
