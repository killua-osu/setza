<article class="setza-service-card">
    <div class="setza-service-image {{ service.image_theme }}"></div>
    <div class="p-3">
        <h3 class="text-[18px] font-semibold">{{ service.title }}</h3>
        <p class="mt-1 text-[14px] font-medium">{{ service.price }}</p>
        <p class="mt-2 text-[13px] leading-5 text-[#6c6761]">{{ service.description }}</p>
        <div class="mt-3 space-y-1 text-[12px] text-[#67625d]">
            <p><i data-lucide="clock-3" class="mr-1 inline h-3.5 w-3.5"></i>{{ service.turnaround }}</p>
            <p>{{ service.concepts }}, {{ service.revisions }}</p>
        </div>
        <button class="mt-4 w-full setza-outline-btn">Inquire</button>
    </div>
</article>
