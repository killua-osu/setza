<article class="setza-panel-card">
    <div class="flex items-start justify-between gap-4">
        <div class="flex items-start gap-3">
            <div class="setza-avatar-lg {{ account.profile_image_theme }}"></div>
            <div>
                <h3 class="text-[20px] font-semibold">{{ account.provider }}</h3>
                <p class="text-[14px] text-[#6b6660]">{{ account.copy }}</p>
                <p class="mt-2 text-[13px] text-[#5f5a54]">{{ account.username }}</p>
            </div>
        </div>
        {% include "components/sync_status_badge.html" with account=account %}
    </div>
    <div class="mt-4 space-y-2 text-[13px] text-[#5f5a54]">
        <p>Permissions: {{ account.scopes|join:", " }}</p>
        <p>Last synced: {{ account.last_synced }}</p>
        <p>Token state: {{ account.token_state }}</p>
    </div>
    <div class="mt-5 flex flex-wrap gap-2">
        <button class="setza-outline-btn">Disconnect</button>
        <button class="setza-primary-btn">Reconnect</button>
    </div>
</article>
