<article class="setza-application-card">
    <div class="mb-4 flex items-start justify-between gap-4">
        <div class="flex items-start gap-3">
            <div class="setza-avatar-lg {{ item.avatar_theme }}"></div>
            <div>
                <div class="flex flex-wrap items-center gap-2">
                    <h3 class="text-[20px] font-semibold">{{ item.name }}</h3>
                    {% include "components/platform_pills.html" with items=item.platforms %}
                </div>
                <p class="text-[13px] text-[#78736d]">{{ item.role }}</p>
                <div class="mt-2 flex flex-wrap gap-5 text-[14px] text-[#4f4b46]">
                    <span>{{ item.followers }}</span>
                    <span>{{ item.engagement }}</span>
                    <span>{{ item.reach }}</span>
                </div>
            </div>
        </div>
        <span class="setza-chip">{{ item.status }}</span>
    </div>
    <div class="rounded-[16px] bg-soft px-5 py-4">
        <p class="mb-1 text-[15px] font-semibold">Application Message:</p>
        <p class="text-[14px] leading-6 text-[#66615c]">{{ item.message }}</p>
    </div>
    <div class="mt-4 flex flex-wrap gap-3">
        <a href="{% if item.role == 'Brand' %}{% url 'brand:profile_opportunities' %}{% else %}{% url 'creator:profile_services' %}{% endif %}" class="setza-outline-btn">View Profile</a>
        <button class="setza-primary-btn">Accept</button>
        <button class="setza-danger-btn">Reject</button>
    </div>
</article>
